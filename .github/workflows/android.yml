name: Android validation

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: bash ./gradlew testDebugUnitTest

      - name: Compile instrumentation tests
        run: bash ./gradlew compileDebugAndroidTestKotlin

      - name: Verify source encoding and resources
        run: bash ./gradlew verifyStringEncoding

      - name: Assemble debug APK
        run: bash ./gradlew assembleDebug
